[project]
name = "splouch"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "itsdangerous",
    "pyserial",
    "websocket-client",
    "pillow>=12.3.0",
]

# NOTE: the Qt TV display (scoreboard/) does NOT declare PyQt5 here.
#
# There is no PyQt5 wheel for 64-bit Raspberry Pi OS. Neither `pyqt5` nor its
# `pyqt5-qt5` runtime publishes a linux aarch64 wheel on PyPI, and piwheels does
# not build them either, so `uv sync` on a Pi fails to resolve at all. The kiosk
# role installs Debian's `python3-pyqt5` (arm64, 5.15.11 — the same version PyPI
# ships elsewhere) and builds its venv with `--system-site-packages` on the system
# interpreter so it can see it. See install/install.sh and scoreboard/README.md.
#
# Qt still lands only on the kiosk: it is an apt package on that Pi, not a Python
# dependency of this project, so the server Pi and the cloud VM stay Qt-free.

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["server"]
